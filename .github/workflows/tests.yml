name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '22' }
          - { os: ubuntu-latest, node: '18' }  # README promises Node.js 18+
          - { os: macos-latest, node: '22' }
          - { os: windows-latest, node: '22' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Versions
        run: python --version && node --version && git --version && bash --version | head -1
      - name: codex-worker
        run: python tests/test_codex_worker.py
      - name: task-brief
        run: python tests/test_task_brief.py
      - name: sdd safety
        run: python tests/test_sdd_safety.py
      - name: worktree cleanup
        run: python tests/test_worktree_cleanup.py
      - name: worktree instructions
        run: python tests/test_worktree_instructions.py
      - name: brainstorm companion
        run: python tests/test_brainstorm_companion.py
      - name: skill text
        run: python tests/test_skill_text.py
      - name: release manifests
        run: python tests/test_release_manifests.py
      - name: find-polluter
        run: python tests/test_find_polluter.py
      - name: piano example
        working-directory: examples/piano
        run: node --test

  validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and plugin manifests
        run: claude plugin validate . && claude plugin validate .claude-plugin/plugin.json
